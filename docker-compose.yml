# docker compose up -d   → http://<server>:5180 (put HTTPS in front, see README)
services:
  canvasnotes:
    build: .
    restart: unless-stopped
    ports:
      # Only reachable through the HTTPS proxy on this machine (see README).
      - "127.0.0.1:5180:5180"
    environment:
      # open | closed (the first account is always allowed)
      CANVASNOTES_SIGNUPS: ${CANVASNOTES_SIGNUPS:-open}
      CANVASNOTES_INVITE_CODE: ${CANVASNOTES_INVITE_CODE:-}
      # Behind Caddy/nginx: rate limits use the real client IP.
      CANVASNOTES_TRUST_PROXY: ${CANVASNOTES_TRUST_PROXY:-1}
    volumes:
      - ./data:/data
